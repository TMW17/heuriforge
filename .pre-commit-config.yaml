# Runs before every commit. Ruff comes from the project environment (`uv run`), so the
# hook and CI always use the same version.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(tests/data|results)/
      - id: end-of-file-fixer
        exclude: ^(tests/data|results)/
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
